# Pre-built images and durable recovery for Firecrawl in GitHub Codespaces.
# This file is copied into /workspaces/firecrawl by setup.sh and is loaded
# automatically by Docker Compose alongside docker-compose.yaml.
services:
  api:
    image: ghcr.io/firecrawl/firecrawl:latest
    build: !reset null
    restart: unless-stopped
  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    build: !reset null
    restart: unless-stopped
  redis:
    restart: unless-stopped
  rabbitmq:
    restart: unless-stopped
  nuq-postgres:
    restart: unless-stopped
  foundationdb:
    restart: unless-stopped
