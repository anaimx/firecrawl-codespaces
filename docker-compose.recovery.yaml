# Durable recovery policy for Firecrawl in GitHub Codespaces.
# Docker restarts these long-lived services after a container or Docker daemon
# interruption. The one-shot foundationdb-init service is intentionally omitted.
services:
  api:
    restart: unless-stopped
  playwright-service:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  rabbitmq:
    restart: unless-stopped
  nuq-postgres:
    restart: unless-stopped
  foundationdb:
    restart: unless-stopped
  searxng:
    restart: unless-stopped
